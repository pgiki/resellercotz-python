[project]
name = "resellercotz-python"
version = "0.1.0"
description = "A friendly Python SDK for the reseller.co.tz API (domains, DNS)"
authors = [{name = "fikachu"}]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
keywords = ["reseller", "dns", "domains", "registrar", "sdk", "tanzania"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: Name Service (DNS)",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.5.0",
    "python-dotenv>=1.0.0",
]

[project.urls]
Homepage = "https://reseller.co.tz/api-docs"
Repository = "https://github.com/pgiki/resellercotz-python"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/resellercotz"]

[tool.ruff]
target-version = "py312"
line-length = 120
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "PLC0415", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"examples/*.py" = ["E402"]
"tests/*.py" = ["PLC0415"]
"tests/**/*.py" = ["PLC0415"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
